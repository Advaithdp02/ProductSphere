worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_buffers      16 8k;
  gzip_http_version 1.1;
  gzip_min_length   256;
  gzip_types
    application/json
    application/javascript
    text/plain
    text/css
    text/xml
    application/xml;

  limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=health_limit:1m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  upstream productsphere_app {
    least_conn;

    server app:3000;

    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options        "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-XSS-Protection       "1; mode=block"      always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header X-Request-ID           $request_id          always;

    server_tokens off;

    proxy_buffers           8 16k;
    proxy_buffer_size       32k;
    proxy_busy_buffers_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    proxy_connect_timeout  5s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    location = /api/health {
      limit_req  zone=health_limit burst=10 nodelay;
      limit_conn conn_limit 20;

      proxy_pass http://productsphere_app;
      proxy_cache_bypass 1;
    }

    location /api/auth/ {
      limit_req  zone=api_limit burst=10 nodelay;
      limit_conn conn_limit 10;

      proxy_pass http://productsphere_app;
    }

    location /api/product/ {
      limit_req  zone=api_limit burst=30 nodelay;
      limit_conn conn_limit 50;

      proxy_pass http://productsphere_app;
    }

    location /api/ {
      limit_req  zone=api_limit burst=20 nodelay;
      limit_conn conn_limit 30;

      proxy_pass http://productsphere_app;
    }

    location / {
      return 404 '{"success":false,"message":"Not found"}';
      add_header Content-Type application/json;
    }

    error_page 429 /429.json;
    location = /429.json {
      return 429 '{"success":false,"message":"Too many requests"}';
      add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
      return 502 '{"success":false,"message":"Service temporarily unavailable"}';
      add_header Content-Type application/json;
    }
  }
}
